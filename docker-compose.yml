x-map-service: &map-service
  build:
    context: ./microservices/data
  environment: &map-env
    SHARED_DIR: /shared
    DATA_DIR: /app/data
    SERVICE_DATA_ROOT: /app/data
    GENERATE_MAX_WORKERS: "1"
  restart: unless-stopped

services:
  infrastructure:
    <<: *map-service
    command: ["python", "-m", "services.infrastructure"]
    environment:
      <<: *map-env
      PORT: "8001"
    volumes:
      - ./microservices/data/data/shared:/shared
      - ./microservices/data/data/services/infrastructure:/app/data
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 8

  cycleways:
    <<: *map-service
    command: ["python", "-m", "services.cycleways"]
    environment:
      <<: *map-env
      PORT: "8002"
    volumes:
      - ./microservices/data/data/shared:/shared
      - ./microservices/data/data/services/cycleways:/app/data
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 8

  walkability:
    <<: *map-service
    command: ["python", "-m", "services.walkability"]
    environment:
      <<: *map-env
      PORT: "8003"
    volumes:
      - ./microservices/data/data/shared:/shared
      - ./microservices/data/data/services/walkability:/app/data
    expose:
      - "8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 10s
      timeout: 3s
      retries: 8

  rents:
    <<: *map-service
    command: ["python", "-m", "services.rents"]
    environment:
      <<: *map-env
      PORT: "8004"
    volumes:
      - ./microservices/data/data/shared:/shared
      - ./microservices/data/data/services/rents:/app/data
    expose:
      - "8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')"]
      interval: 10s
      timeout: 3s
      retries: 8

  api:
    <<: *map-service
    command: ["python", "-m", "server"]
    ports:
      - "8000:8000"
    volumes:
      - ./microservices/data/data/shared:/shared
    environment:
      SHARED_DIR: /shared
      DATA_DIR: /tmp/router
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173"
      INFRASTRUCTURE_URL: http://infrastructure:8001
      CYCLEWAYS_URL: http://cycleways:8002
      WALKABILITY_URL: http://walkability:8003
      RENTS_URL: http://rents:8004
    depends_on:
      infrastructure:
        condition: service_healthy
      cycleways:
        condition: service_healthy
      walkability:
        condition: service_healthy
      rents:
        condition: service_healthy
    restart: unless-stopped

  # The three Go services build from the repository root because they share the
  # urban/gen and urban/pkg modules.
  hex-svc:
    build:
      context: .
      dockerfile: microservices/hex/Dockerfile
    environment:
      HEX_GRPC_ADDR: ":50051"
      HEX_DATA_DIR: /infra
      HEX_RENTS_DIR: /rents
      # Cities are parsed on first request and evicted LRU, so memory does not
      # grow with the number of generated cities.
      HEX_CACHE_CITIES: "4"
      HEX_RESCAN_INTERVAL: "30s"
    volumes:
      - ./microservices/data/data/services/infrastructure:/infra:ro
      - ./microservices/data/data/services/rents:/rents:ro
    depends_on:
      infrastructure:
        condition: service_healthy
    expose:
      - "50051"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped

  llm-svc:
    build:
      context: .
      dockerfile: microservices/llm/Dockerfile
    extra_hosts:
      # Linux Docker: reach Ollama on the host. Docker Desktop already defines this.
      - "host.docker.internal:host-gateway"
    environment:
      LLM_GRPC_ADDR: ":50052"
      # Native Ollama on the host (Metal on macOS). Override to http://ollama:11434
      # when using --profile bundled-ollama.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_TIMEOUT: "3m"
      OLLAMA_CONNECT_TIMEOUT: "10s"
      OLLAMA_FIRST_TOKEN_TIMEOUT: "45s"
      OLLAMA_NUM_PREDICT: "192"
      OLLAMA_KEEP_ALIVE: "30m"
    expose:
      - "50052"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50052"]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8081:8081"
    environment:
      GATEWAY_HTTP_ADDR: ":8081"
      HEX_GRPC_TARGET: hex-svc:50051
      LLM_GRPC_TARGET: llm-svc:50052
      # Exact-match allowlist. Requests from any other origin get no CORS
      # headers, so a third-party page cannot drive the LLM endpoint.
      GATEWAY_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173"
      GATEWAY_CHAT_RATE_PER_MINUTE: "20"
      GATEWAY_CHAT_BURST: "5"
      GATEWAY_CHAT_TIMEOUT: "2m"
      GATEWAY_HEX_TIMEOUT: "5s"
    depends_on:
      hex-svc:
        condition: service_healthy
      llm-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped

  # CPU-only fallback. Default `docker compose up` talks to native Ollama on the
  # host instead (Metal on Mac). To use this stack:
  #   OLLAMA_URL=http://ollama:11434 docker compose --profile bundled-ollama up
  ollama:
    profiles: ["bundled-ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ollama-pull:
    profiles: ["bundled-ollama"]
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull llama3.2:3b"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
      - gateway
    restart: unless-stopped

volumes:
  ollama:
