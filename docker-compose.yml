services:
  api:
    build:
      context: ./microservices/data
    ports:
      - "8000:8000"
    volumes:
      - ./microservices/data/data:/app/data
    environment:
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173"
      # City generation is Overpass-bound; more workers means more parallel
      # conversations with the same public mirrors, not more throughput.
      GENERATE_MAX_WORKERS: "2"
    restart: unless-stopped

  # The three Go services build from the repository root because they share the
  # urban/gen and urban/pkg modules.
  hex-svc:
    build:
      context: .
      dockerfile: microservices/hex/Dockerfile
    environment:
      HEX_GRPC_ADDR: ":50051"
      HEX_DATA_DIR: /data/cities
      # Cities are parsed on first request and evicted LRU, so memory does not
      # grow with the number of generated cities.
      HEX_CACHE_CITIES: "4"
      HEX_RESCAN_INTERVAL: "30s"
    volumes:
      - ./microservices/data/data/cities:/data/cities:ro
    expose:
      - "50051"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped

  llm-svc:
    build:
      context: .
      dockerfile: microservices/llm/Dockerfile
    extra_hosts:
      # Linux Docker: reach Ollama on the host. Docker Desktop already defines this.
      - "host.docker.internal:host-gateway"
    environment:
      LLM_GRPC_ADDR: ":50052"
      # Native Ollama on the host (Metal on macOS). Override to http://ollama:11434
      # when using --profile bundled-ollama.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_TIMEOUT: "3m"
      OLLAMA_CONNECT_TIMEOUT: "10s"
      OLLAMA_FIRST_TOKEN_TIMEOUT: "45s"
      OLLAMA_NUM_PREDICT: "192"
      OLLAMA_KEEP_ALIVE: "30m"
    expose:
      - "50052"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50052"]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8081:8081"
    environment:
      GATEWAY_HTTP_ADDR: ":8081"
      HEX_GRPC_TARGET: hex-svc:50051
      LLM_GRPC_TARGET: llm-svc:50052
      # Exact-match allowlist. Requests from any other origin get no CORS
      # headers, so a third-party page cannot drive the LLM endpoint.
      GATEWAY_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173"
      GATEWAY_CHAT_RATE_PER_MINUTE: "20"
      GATEWAY_CHAT_BURST: "5"
      GATEWAY_CHAT_TIMEOUT: "2m"
      GATEWAY_HEX_TIMEOUT: "5s"
    depends_on:
      hex-svc:
        condition: service_healthy
      llm-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped

  # CPU-only fallback. Default `docker compose up` talks to native Ollama on the
  # host instead (Metal on Mac). To use this stack:
  #   OLLAMA_URL=http://ollama:11434 docker compose --profile bundled-ollama up
  ollama:
    profiles: ["bundled-ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ollama-pull:
    profiles: ["bundled-ollama"]
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull llama3.2:3b"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
      - gateway
    restart: unless-stopped

volumes:
  ollama:
